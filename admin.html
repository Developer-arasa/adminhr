<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Arasa Store</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
    
    :root { 
      --bg-body: #f7f9fc; 
      --card-bg: #ffffff; 
      --primary-red: #e63946; 
      --primary-dark: #c1121f; 
      --text-main: #2b2d42; 
      --text-muted: #8d99ae; 
      --border-color: #edf2f7; 
      --btn-approve: #10b981; 
      --btn-reject: #ef4444; 
    }
    
    body { font-family: 'Poppins', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; display: flex; justify-content: center; min-height: 100vh; }
    .app-wrapper { width: 100%; max-width: 1200px; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; }
    .panel { background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
    .brand-area { text-align: center; margin-bottom: 20px; }
    .brand-area h1 { margin: 0; font-size: 26px; font-weight: 800; color: var(--primary-red); }
    .brand-area p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
    
    .nav-scroll-container { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 5px; scrollbar-width: none; }
    .nav-scroll-container::-webkit-scrollbar { display: none; }
    .nav-btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: #f1f5f9; color: var(--text-muted); text-align: center; white-space: nowrap; border: none; transition: 0.3s;}
    .nav-btn.active, .nav-btn:hover { background: var(--primary-red); color: white; }
    
    .sub-nav-btn { flex: 1; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; background: transparent; color: var(--text-muted); text-align: center; border: 1px solid transparent; transition: 0.3s; }
    .sub-nav-btn.active { background: #fff5f5; border: 1px solid #fed7d7; color: var(--primary-red); }
    
    .view-section { display: none; animation: fadeIn 0.3s ease;}
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    
    .stat-card { text-align: center; padding: 20px; border-radius: 16px; background: #fff5f5; border: 1px solid #fed7d7; }
    .stat-val { font-size: 32px; font-weight: 800; color: var(--primary-red); margin: 5px 0;}
    
    .req-card { background: white; border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .req-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 10px; align-items:center;}
    .req-title { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .req-body { font-size: 12px; color: #4a5568; line-height: 1.5; margin-bottom: 15px; }
    
    .status-badge { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; }
    .DISETUJUI, .IZIN_DIBERIKAN { background: #d1fae5; color: #047857; }
    .DITOLAK, .IZIN_TIDAK_DIBERIKAN { background: #fee2e2; color: #b91c1c; }
    .PENDING { background: #fef3c7; color: #b45309; }
    
    .btn-red { background: var(--primary-red); color: white; width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; margin-bottom: 15px; font-family: 'Poppins'; transition: 0.2s;}
    .btn-red:hover { background: var(--primary-dark); }
    .btn-outline { background: white; color: var(--primary-red); border: 2px solid var(--primary-red); width: 100%; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-bottom: 15px; font-family: 'Poppins'; transition: 0.2s;}
    .btn-outline:hover { background: #fff5f5; }
    
    .calendar-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .calendar-controls button { background: #f1f5f9; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 800; cursor: pointer; color: var(--primary-red); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-day { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 4px; text-align: center; min-height: 55px; display:flex; flex-direction:column; align-items:center; justify-content:center; transition: 0.2s;}
    .cal-day.has-data:hover { border-color: var(--primary-red); transform: scale(1.05); cursor: pointer;}
    .cal-badge { font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 6px; margin-top: 4px; }
    .cal-badge.zero { background: #edf2f7; color: var(--text-muted); }
    .cal-badge.red { background: var(--primary-red); color: white; }
    
    .acc-item { background: white; border-radius: 14px; margin-bottom: 10px; border: 1px solid var(--border-color); overflow: hidden; }
    .acc-header { padding: 15px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .acc-body { display: none; padding: 15px; border-top: 1px dashed #eee; }
    .acc-row { display: flex; justify-content: space-between; font-size: 12px; padding: 8px 0; border-bottom: 1px solid #f9f9f9; align-items: center;}
    .acc-row:last-child { border-bottom: none; padding-bottom: 0; }
    
    input, select { width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 12px; box-sizing: border-box; background: #f8fafc; margin-bottom: 15px; outline: none; font-family: 'Poppins'; font-weight: 600; }
    input:focus, select:focus { border-color: var(--primary-red); }
    
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
    .modal-box { background: white; width: 90%; max-width: 380px; border-radius: 24px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: left; max-height: 80vh; overflow-y: auto;}
    .btn-pop { padding: 12px 20px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; min-width: 100px; font-family: 'Poppins'; transition: 0.2s;}
    .filter-group { display: flex; gap: 10px; }
  </style>
</head>
<body>

<div class="app-wrapper">
  
  <div class="panel">
    <div class="brand-area">
      <h1>Arasa Admin</h1>
      <p>Management & Approval System</p>
    </div>
    <div class="nav-scroll-container">
      <button class="nav-btn active" id="nav-vDash" onclick="switchView('vDash')">Overview</button>
      <button class="nav-btn" id="nav-vApp" onclick="switchView('vApp')">Approval</button>
      <button class="nav-btn" id="nav-vData" onclick="switchView('vData')">Data Terpadu</button>
      <button class="nav-btn" id="nav-vDb" onclick="switchView('vDb')">Database</button>
      <button class="nav-btn" id="nav-vKar" onclick="switchView('vKar')">Karyawan</button>
    </div>
  </div>

  <div id="vDash" class="view-section active panel">
    <div class="grid-2">
      <div class="stat-card">Pending Izin<br><div class="stat-val" id="countIzin">0</div></div>
      <div class="stat-card">Pending Lembur<br><div class="stat-val" id="countLembur">0</div></div>
    </div>
  </div>

  <div id="vApp" class="view-section panel">
    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <button class="sub-nav-btn active" onclick="switchAppTab('apI', this)">Izin</button>
      <button class="sub-nav-btn" onclick="switchAppTab('apL', this)">Lembur</button>
    </div>
    <div id="apI"><div id="boxAppIzin"></div></div>
    <div id="apL" style="display:none;">
      <button class="btn-red" onclick="bulkApproveLembur()">SIKAT SEMUA (APPROVE ALL)</button>
      <div id="boxAppLembur"></div>
    </div>
  </div>

  <div id="vData" class="view-section panel">
    <div style="text-align:center; font-weight:800; font-size:12px; color:var(--text-muted); text-transform:uppercase; margin-bottom:15px; letter-spacing:1px;">
      Mode: Operasional Bulan Berjalan
    </div>
    
    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <button class="sub-nav-btn active" onclick="switchDataTab('dtI', this)">Izin (Bulan Ini)</button>
      <button class="sub-nav-btn" onclick="switchDataTab('dtL', this)">Lembur (Bulan Ini)</button>
    </div>

    <div id="dtI" style="display: block;"><div id="boxDtIzin"></div></div>

    <div id="dtL" style="display: none;">
      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <button class="sub-nav-btn active" onclick="switchLemburTab('dtL_Kal', this)">Kalender</button>
        <button class="sub-nav-btn" onclick="switchLemburTab('dtL_Kar', this)">Per Karyawan</button>
      </div>
      
      <div id="dtL_Kal" style="display: block;"><div id="boxDtLemburKal"></div></div>
      <div id="dtL_Kar" style="display: none;">
        <input type="text" id="searchDtL_Kar" placeholder="🔍 Cari Nama (Bulan Terpilih)..." onkeyup="renderDtL_Kar()">
        <div id="boxDtLemburKar"></div>
      </div>
    </div>
  </div>

  <div id="vDb" class="view-section panel">
    <div style="text-align:center; font-weight:800; font-size:12px; color:var(--text-muted); text-transform:uppercase; margin-bottom:15px; letter-spacing:1px;">
      Mode: Arsip Keseluruhan Data
    </div>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <button class="sub-nav-btn active" onclick="switchDbTab('dbI', this)">DB Izin</button>
      <button class="sub-nav-btn" onclick="switchDbTab('dbL', this)">DB Lembur</button>
    </div>

    <div id="dbI" style="display: block;">
      <button class="btn-outline" onclick="exportData('izin')">📥 DOWNLOAD LAPORAN IZIN</button>
      <div class="filter-group">
        <input type="text" id="searchDbIzin" placeholder="🔍 Cari Nama..." onkeyup="renderDbIzin()">
        <select id="filterBulanDbIzin" onchange="renderDbIzin()"></select>
      </div>
      <div id="boxDbIzin"></div>
    </div>

    <div id="dbL" style="display: none;">
      <button class="btn-outline" onclick="exportData('lembur')">📥 DOWNLOAD LAPORAN LEMBUR</button>
      <div class="filter-group">
        <input type="text" id="searchDbLembur" placeholder="🔍 Cari Nama..." onkeyup="renderDbLembur()">
        <select id="filterBulanDbLembur" onchange="renderDbLembur()"></select>
      </div>
      <div id="boxDbLembur"></div>
    </div>
  </div>

  <div id="vKar" class="view-section panel">
    <button class="btn-red" onclick="openKarModal('ADD')">+ TAMBAH KARYAWAN</button>
    <div id="boxListKaryawan"></div>
  </div>

</div>

<div id="popupOverlay" class="modal-overlay">
  <div class="modal-box" style="text-align:center;">
    <h3 id="popTitle" style="color:var(--primary-red); margin-top:0;">Notifikasi</h3>
    <p id="popMsg" style="font-size:13px; margin-bottom:20px; color:var(--text-main);"></p>
    <div id="popBtns" style="display:flex; gap:10px; justify-content:center;"></div>
  </div>
</div>

<div id="actModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="color:var(--primary-red); margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px;">⚙️ Kelola Data</h3>
    <p id="actDesc" style="font-size:12px; color:var(--text-muted);"></p>
    <label style="font-size:11px; font-weight:700; color:var(--text-main);">Ubah Status:</label>
    <select id="actStatus" style="width:100%; margin-bottom:20px;"></select>
    <div style="display:flex; gap:10px;">
      <button class="btn-pop" style="background:var(--btn-approve); color:white; flex:1;" onclick="saveAct()">Simpan</button>
      <button class="btn-pop" style="background:var(--btn-reject); color:white; flex:1;" onclick="deleteAct()">Hapus</button>
    </div>
    <button class="btn-pop" style="width:100%; margin-top:10px; background:#f1f5f9; color:var(--text-main);" onclick="closeModal('actModal')">Batal</button>
  </div>
</div>

<div id="karModal" class="modal-overlay">
  <div class="modal-box">
    <h3 id="karTitle" style="color:var(--primary-red); margin-top:0;">Form Karyawan</h3>
    <input type="text" id="kId" placeholder="ID Karyawan">
    <input type="text" id="kNm" placeholder="Nama Lengkap">
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn-pop" style="background:#f1f5f9; flex:1;" onclick="closeModal('karModal')">Batal</button>
      <button class="btn-pop" style="background:var(--primary-red); color:white; flex:1;" onclick="saveKar()">Simpan</button>
    </div>
  </div>
</div>

<div id="kalenderModal" class="modal-overlay">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px;">
      <h3 id="kalenderModalTitle" style="margin:0; font-size: 15px; color:var(--text-main);">Daftar Lembur</h3>
      <button onclick="closeModal('kalenderModal')" style="padding: 6px 12px; border-radius: 8px; background: #eee; color: var(--text-main); font-size: 11px; font-weight:700; border:none; cursor:pointer;">Tutup</button>
    </div>
    <div id="kalenderModalContent"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://dhlmzugrqvrmoicbnmpn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4e2ckBZ-OzOaF4LBIS1ZTQ_y6Ve1AOh';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let state = { master: [], izin: [], lembur: [] };
  let currentCalMonth = new Date().getMonth(); 
  let currentCalYear = new Date().getFullYear();
  let curT = ''; let curId = null;

  window.onload = () => { 
    try { history.replaceState({ view: 'vDash' }, '', '#vDash'); } catch(e) {}
    fetchAllData(); 
  };

  // --- PENERJEMAH BAHASA MANUSIA UNTUK JAM ---
  function formatTeksJam(val) {
    if(!val) return "0 Menit";
    let totalMenit = Math.round(parseFloat(val) * 60);
    let j = Math.floor(totalMenit / 60);
    let m = totalMenit % 60;
    
    if(j > 0 && m > 0) return `${j} Jam ${m} Menit`;
    if(j > 0) return `${j} Jam`;
    return `${m} Menit`;
  }

  // --- SYSTEM POPUPS ---
  function showCustomAlert(msg) {
    const ov = document.getElementById('popupOverlay'); 
    document.getElementById('popTitle').innerText = "Notifikasi";
    document.getElementById('popMsg').innerText = msg;
    document.getElementById('popBtns').innerHTML = `<button class="btn-pop" style="background:var(--primary-red); color:white;" onclick="closePop()">OK</button>`;
    ov.style.display = 'flex'; setTimeout(() => ov.style.opacity = '1', 10);
  }

  function showCustomConfirm(msg, callback) {
    const ov = document.getElementById('popupOverlay'); 
    document.getElementById('popTitle').innerText = "Konfirmasi";
    document.getElementById('popMsg').innerText = msg;
    document.getElementById('popBtns').innerHTML = `<button class="btn-pop" style="background:#f1f5f9; color:var(--text-main);" onclick="closePop()">Batal</button><button class="btn-pop" style="background:var(--primary-red); color:white;" id="popOk">Yakin</button>`;
    document.getElementById('popOk').onclick = () => { closePop(); callback(); };
    ov.style.display = 'flex'; setTimeout(() => ov.style.opacity = '1', 10);
  }

  function closePop() { const ov = document.getElementById('popupOverlay'); ov.style.opacity = '0'; setTimeout(() => ov.style.display = 'none', 300); }
  function closeModal(id) { const el = document.getElementById(id); el.style.opacity = '0'; setTimeout(() => el.style.display = 'none', 300); }
  function toggleAcc(id) { const el = document.getElementById(id); el.style.display = (el.style.display === 'block') ? 'none' : 'block'; }

  // --- TABS & NAVIGATION ---
  function switchView(id) { 
    document.querySelectorAll('.view-section').forEach(x => x.classList.remove('active')); document.getElementById(id).classList.add('active'); 
    document.querySelectorAll('.nav-scroll-container .nav-btn').forEach(x => x.classList.remove('active')); document.getElementById('nav-' + id).classList.add('active'); 
    window.scrollTo(0, 0); 
  }
  function switchAppTab(id, el) { 
    document.getElementById('apI').style.display = id === 'apI' ? 'block' : 'none'; document.getElementById('apL').style.display = id === 'apL' ? 'block' : 'none'; 
    el.parentElement.querySelectorAll('.sub-nav-btn').forEach(x => x.classList.remove('active')); el.classList.add('active'); 
  }
  function switchDataTab(id, el) { 
    document.getElementById('dtI').style.display = id === 'dtI' ? 'block' : 'none'; document.getElementById('dtL').style.display = id === 'dtL' ? 'block' : 'none'; 
    el.parentElement.querySelectorAll('.sub-nav-btn').forEach(x => x.classList.remove('active')); el.classList.add('active'); 
  }
  function switchLemburTab(id, el) { 
    document.getElementById('dtL_Kal').style.display = id === 'dtL_Kal' ? 'block' : 'none'; document.getElementById('dtL_Kar').style.display = id === 'dtL_Kar' ? 'block' : 'none'; 
    el.parentElement.querySelectorAll('.sub-nav-btn').forEach(x => x.classList.remove('active')); el.classList.add('active'); 
  }
  function switchDbTab(id, el) { 
    document.getElementById('dbI').style.display = id === 'dbI' ? 'block' : 'none'; document.getElementById('dbL').style.display = id === 'dbL' ? 'block' : 'none'; 
    el.parentElement.querySelectorAll('.sub-nav-btn').forEach(x => x.classList.remove('active')); el.classList.add('active'); 
  }

  // --- DATABASE DATA FETCH ---
  async function fetchAllData() {
    try {
      const [resMaster, resIzin, resLembur] = await Promise.all([
        db.from('master_data').select('*').order('nama_karyawan'),
        db.from('data_izin').select('*').order('created_at', { ascending: false }),
        db.from('data_lembur').select('*').order('tanggal_lembur', { ascending: false })
      ]);
      
      state.master = resMaster.data || []; state.izin = resIzin.data || []; state.lembur = resLembur.data || [];
      populateFilterDropdowns(); distributeRendering();
    } catch (err) { showCustomAlert("Gagal terhubung ke Database Supabase."); }
  }

  function getMonthStringFromDate(dateStr) {
    if(!dateStr) return "-"; 
    const parts = dateStr.split('-');
    if(parts.length !== 3) return "-";
    const mNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    return `${mNames[parseInt(parts[1]) - 1]} ${parts[0]}`;
  }

  function getActiveMonthString() { 
    const mNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember']; 
    return `${mNames[currentCalMonth]} ${currentCalYear}`; 
  }

  function changeCalMonth(step) {
    currentCalMonth += step;
    if(currentCalMonth < 0) { currentCalMonth = 11; currentCalYear--; } else if(currentCalMonth > 11) { currentCalMonth = 0; currentCalYear++; }
    renderDtI(); renderDtL_Kal(); renderDtL_Kar();
  }

  function populateFilterDropdowns() {
    const setBulanIzin = new Set(state.izin.map(x => getMonthStringFromDate(x.tanggal_izin_mulai)));
    let optIzin = '<option value="ALL">Semua Bulan</option>'; setBulanIzin.forEach(b => { if(b !== "-") optIzin += `<option value="${b}">${b}</option>`; });
    document.getElementById('filterBulanDbIzin').innerHTML = optIzin;

    const setBulanLembur = new Set(state.lembur.map(x => x.bulan_lembur));
    let optLembur = '<option value="ALL">Semua Bulan</option>'; setBulanLembur.forEach(b => { if(b) optLembur += `<option value="${b}">${b}</option>`; });
    document.getElementById('filterBulanDbLembur').innerHTML = optLembur;
  }

  function distributeRendering() {
    document.getElementById('countIzin').innerText = state.izin.filter(x => x.status === 'PENDING').length;
    document.getElementById('countLembur').innerText = state.lembur.filter(x => x.status === 'PENDING').length;
    
    renderAppIzin(); renderAppLembur(); 
    renderDtI(); renderDtL_Kal(); renderDtL_Kar();
    renderDbIzin(); renderDbLembur(); renderKaryawan();
  }

  // --- RENDER APPROVAL ---
  function renderAppIzin() {
    const box = document.getElementById('boxAppIzin'); const pending = state.izin.filter(x => x.status === 'PENDING');
    if(pending.length === 0) { box.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">✅ Semua izin sudah diproses.</div>'; return; }
    
    let h = '<div class="grid-2">';
    pending.forEach(i => {
      h += `
      <div class="req-card">
        <div class="req-header"><div class="req-title">${i.nama}</div><div class="req-date">#${i.id_karyawan}</div></div>
        <div class="req-body"><strong>${i.kategori_izin}</strong><br>${i.tanggal_izin_mulai} s/d ${i.tanggal_izin_akhir}<br>"${i.alasan}"</div>
        <div class="action-btns">
          <button class="btn-action btn-reject" onclick="updateStatus('data_izin', ${i.id}, 'IZIN TIDAK DIBERIKAN')">Tolak</button>
          <button class="btn-action btn-approve" onclick="updateStatus('data_izin', ${i.id}, 'IZIN DIBERIKAN')">Setujui</button>
        </div>
      </div>`;
    }); box.innerHTML = h + '</div>';
  }

  function renderAppLembur() {
    const box = document.getElementById('boxAppLembur'); const pending = state.lembur.filter(x => x.status === 'PENDING');
    if(pending.length === 0) { box.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">✅ Tidak ada antrean lembur.</div>'; return; }
    
    let h = '<div class="grid-2">';
    pending.forEach(l => {
      h += `
      <div class="req-card">
        <div class="req-header"><div class="req-title">${l.nama}</div><div class="req-date">${l.tanggal_lembur}</div></div>
        <div class="req-body"><strong>${l.jam_awal} - ${l.jam_selesai}</strong> (${formatTeksJam(l.durasi)})<br>"${l.alasan}"</div>
        <div class="action-btns">
          <button class="btn-action btn-reject" onclick="updateStatus('data_lembur', ${l.id}, 'DITOLAK')">Tolak</button>
          <button class="btn-action btn-approve" onclick="updateStatus('data_lembur', ${l.id}, 'DISETUJUI')">Setujui</button>
        </div>
      </div>`;
    }); box.innerHTML = h + '</div>';
  }

  async function updateStatus(table, id, status) { await db.from(table).update({ status: status }).eq('id', id); showCustomAlert("Status berhasil diperbarui!"); fetchAllData(); }
  function bulkApproveLembur() { showCustomConfirm("Yakin ingin menyetujui semua data lembur yang pending?", async () => { const ids = state.lembur.filter(x => x.status === 'PENDING').map(x => x.id); if(ids.length > 0) { await db.from('data_lembur').update({ status: 'DISETUJUI' }).in('id', ids); showCustomAlert("Semua lemburan disetujui!"); fetchAllData(); } }); }

  // --- RENDER DATA TERPADU ---
  function renderDtI() {
    const box = document.getElementById('boxDtIzin'); const curStr = getActiveMonthString();
    const riwayat = state.izin.filter(x => x.status !== 'PENDING' && getMonthStringFromDate(x.tanggal_izin_mulai) === curStr);
    if(riwayat.length === 0) { box.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Belum ada riwayat izin di bulan ${curStr}.</div>`; return; }
    
    let h = '<div class="grid-2">';
    riwayat.forEach(i => {
      const sClass = i.status.includes('TIDAK') ? 'DITOLAK' : 'DISETUJUI';
      h += `
      <div class="req-card">
        <div class="req-header"><div class="req-title">${i.nama}</div><span class="status-badge ${sClass}">${i.status}</span></div>
        <div class="req-body"><strong>${i.kategori_izin}</strong><br>${i.tanggal_izin_mulai} s/d ${i.tanggal_izin_akhir}<br>"${i.alasan}"</div>
        <div style="border-top:1px dashed var(--border-color); padding-top:10px; margin-top:5px; text-align:right;">
          <button onclick="openAct('data_izin', ${i.id}, '${i.status}', '${i.nama.replace(/'/g, "\\'")}')" style="background:#f1f5f9; border:none; padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; color:var(--text-main);">⚙️ Kelola Data</button>
        </div>
      </div>`;
    }); box.innerHTML = h + '</div>';
  }

  function renderDtL_Kal() {
    const box = document.getElementById('boxDtLemburKal'); const curStr = getActiveMonthString();
    // TAMPILKAN SEMUA DATA YANG SUDAH DIPROSES (SETUJU & TOLAK)
    const currData = state.lembur.filter(x => x.bulan_lembur === curStr && x.status !== 'PENDING');
    const days = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
    let fd = new Date(currentCalYear, currentCalMonth, 1).getDay(); fd = (fd === 0) ? 6 : fd - 1;
    
    let h = `<div class="calendar-controls"><button onclick="changeCalMonth(-1)">&#10094; Mundur</button><div style="font-weight:800; font-size:14px; color:var(--primary-red);">${curStr}</div><button onclick="changeCalMonth(1)">Maju &#10095;</button></div><div class="calendar-grid">`;
    for(let i=0; i<fd; i++) h += `<div class="cal-day" style="background:transparent; border:none;"></div>`;
    for(let d=1; d<=days; d++) {
      const dStr = `${currentCalYear}-${String(currentCalMonth + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const rec = currData.filter(x => x.tanggal_lembur === dStr);
      h += `<div class="cal-day ${rec.length > 0 ? 'has-data' : ''}" ${rec.length > 0 ? `onclick="openKalenderModal('${dStr}')"` : ''}><span style="font-size:12px; font-weight:700;">${d}</span><span class="cal-badge ${rec.length>0 ? 'red' : 'zero'}">${rec.length}</span></div>`;
    } box.innerHTML = h + `</div>`;
  }

  function openKalenderModal(dateStr) {
    const records = state.lembur.filter(r => r.tanggal_lembur === dateStr && r.status !== 'PENDING');
    document.getElementById('kalenderModalTitle').innerText = `Lembur: ${dateStr}`;
    let html = '';
    records.forEach(r => {
      const isDitolak = r.status === 'DITOLAK';
      const statusBadge = isDitolak ? '<span style="font-size:9px; background:#fee2e2; color:#b91c1c; padding:2px 6px; border-radius:4px; margin-left:5px;">DITOLAK</span>' : '';
      const jamStyle = isDitolak ? 'text-decoration:line-through; color:#94a3b8; background:#f1f5f9;' : 'color:var(--primary-red); background:#fff5f5;';
      
      html += `
      <div style="padding: 12px 0; border-bottom: 1px dashed rgba(0,0,0,0.1); display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size: 13px; font-weight: 700; color: var(--text-main);">👤 ${r.nama} ${statusBadge}</span>
        <div style="text-align:right;">
          <div style="font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 6px; display:inline-block; margin-bottom:4px; ${jamStyle}">${formatTeksJam(r.durasi)}</div>
          <div style="font-size: 10px; color: var(--text-muted); font-weight: 600;">${r.jam_awal} - ${r.jam_selesai}</div>
        </div>
      </div>`;
    });
    document.getElementById('kalenderModalContent').innerHTML = html;
    document.getElementById('kalenderModal').style.display = 'flex';
    setTimeout(() => { document.getElementById('kalenderModal').style.opacity = '1'; }, 10);
  }

  function renderDtL_Kar() {
    const box = document.getElementById('boxDtLemburKar'); const curStr = getActiveMonthString();
    const searchVal = document.getElementById('searchDtL_Kar').value.toLowerCase();
    const currData = state.lembur.filter(x => x.bulan_lembur === curStr && x.status !== 'PENDING' && (x.nama.toLowerCase().includes(searchVal) || x.id_karyawan.toLowerCase().includes(searchVal)));
    
    if(currData.length === 0) { box.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Belum ada rekap lemburan di bulan ${curStr}.</div>`; return; }
    
    const grp = {};
    currData.forEach(x => { 
      const dVal = parseFloat(x.durasi) || 0;
      if(!grp[x.nama]) grp[x.nama] = { id: x.id_karyawan, rec: [], totalJam: 0 }; 
      grp[x.nama].rec.push(x); 
      // CUMA DIJUMLAHIN KALAU STATUSNYA DISETUJUI
      if(x.status === 'DISETUJUI') {
        grp[x.nama].totalJam += dVal; 
      }
    });
    
    let h = '<div class="grid-2">'; let idx=0;
    for(const n in grp) {
      h += `
      <div class="acc-item">
        <div class="acc-header" onclick="toggleAcc('opAcc-${idx}')">
          <span>${n} <span style="font-size:10px;color:var(--text-muted);">#${grp[n].id}</span></span>
          <span class="acc-badge" style="background:#fff0f2; color:var(--primary-red); padding:4px 8px; border-radius:6px;">${formatTeksJam(grp[n].totalJam)}</span>
        </div>
        <div id="opAcc-${idx}" class="acc-body">`;
      grp[n].rec.forEach(r => { 
        const isDitolak = r.status === 'DITOLAK';
        const statusBadge = isDitolak ? '<span style="font-size:9px; background:#fee2e2; color:#b91c1c; padding:2px 6px; border-radius:4px; margin-left:5px;">DITOLAK</span>' : '';
        const durasiStyle = isDitolak ? 'text-decoration:line-through; color:#94a3b8;' : 'color:var(--text-main);';

        h += `
        <div class="acc-row">
          <div style="flex:1;"><span>📅 ${r.tanggal_lembur} <strong style="color:var(--primary-red); font-size:10px;">(${r.jam_awal} - ${r.jam_selesai})</strong></span> ${statusBadge}</div>
          <div style="display:flex; align-items:center; gap:10px;">
            <strong style="${durasiStyle}">${formatTeksJam(r.durasi)}</strong>
            <button onclick="openAct('data_lembur', ${r.id}, '${r.status}', '${n.replace(/'/g, "\\'")}')" style="background:#f1f5f9; border:none; padding:4px 8px; border-radius:6px; font-size:10px; font-weight:700; cursor:pointer; color:var(--text-main);">⚙️</button>
          </div>
        </div>`; 
      });
      h += `</div></div>`; idx++;
    } box.innerHTML = h + '</div>';
  }

  // --- KELOLA DATA (ACTION MODAL) ---
  function openAct(t, id, s, n) {
    curT = t; curId = id; document.getElementById('actDesc').innerHTML = `Modifikasi data milik <strong>${n}</strong>.`; const sel = document.getElementById('actStatus');
    if(t === 'data_izin') { sel.innerHTML = `<option value="IZIN DIBERIKAN" ${s==='IZIN DIBERIKAN'?'selected':''}>Setuju (Izin Diberikan)</option><option value="IZIN TIDAK DIBERIKAN" ${s==='IZIN TIDAK DIBERIKAN'?'selected':''}>Tolak (Izin Tidak Diberikan)</option><option value="PENDING" ${s==='PENDING'?'selected':''}>Pending</option>`; } 
    else { sel.innerHTML = `<option value="DISETUJUI" ${s==='DISETUJUI'?'selected':''}>Setuju</option><option value="DITOLAK" ${s==='DITOLAK'?'selected':''}>Tolak</option><option value="PENDING" ${s==='PENDING'?'selected':''}>Pending</option>`; }
    document.getElementById('actModal').style.display = 'flex'; setTimeout(() => document.getElementById('actModal').style.opacity = '1', 10);
  }

  async function saveAct() { await db.from(curT).update({ status: document.getElementById('actStatus').value }).eq('id', curId); closeModal('actModal'); showCustomAlert("Berhasil diperbarui!"); fetchAllData(); }
  function deleteAct() { showCustomConfirm("Hapus permanen data ini dari database?", async () => { await db.from(curT).delete().eq('id', curId); closeModal('actModal'); showCustomAlert("Data berhasil dihapus!"); fetchAllData(); }); }

  // --- DATABASE (ALL TIME VIEW & EXPORT) ---
  function renderDbIzin() {
    const s = document.getElementById('searchDbIzin').value.toLowerCase(); const b = document.getElementById('filterBulanDbIzin').value; const box = document.getElementById('boxDbIzin');
    const filtered = state.izin.filter(x => x.status !== 'PENDING' && (x.nama.toLowerCase().includes(s) || x.id_karyawan.toLowerCase().includes(s)) && (b === 'ALL' || getMonthStringFromDate(x.tanggal_izin_mulai) === b));
    if(filtered.length === 0) { box.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Data tidak ditemukan.</div>'; return; }
    
    let h = '<div class="grid-2">';
    filtered.forEach(i => {
      const sClass = i.status.includes('TIDAK') ? 'DITOLAK' : 'DISETUJUI';
      h += `<div class="req-card"><div class="req-header"><div class="req-title">${i.nama}</div><span class="status-badge ${sClass}">${i.status}</span></div><div class="req-body"><strong>${i.kategori_izin}</strong><br>${i.tanggal_izin_mulai} s/d ${i.tanggal_izin_akhir}<br>"${i.alasan}"</div></div>`;
    }); box.innerHTML = h + '</div>';
  }

  function renderDbLembur() {
    const s = document.getElementById('searchDbLembur').value.toLowerCase(); const b = document.getElementById('filterBulanDbLembur').value; const box = document.getElementById('boxDbLembur');
    const filtered = state.lembur.filter(x => x.status !== 'PENDING' && (x.nama.toLowerCase().includes(s) || x.id_karyawan.toLowerCase().includes(s)) && (b === 'ALL' || x.bulan_lembur === b));
    if(filtered.length === 0) { box.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Data tidak ditemukan.</div>'; return; }
    
    const grp = {};
    filtered.forEach(x => { 
      const dVal = parseFloat(x.durasi) || 0;
      if(!grp[x.nama]) grp[x.nama] = { id: x.id_karyawan, rec: [], totalJam: 0 }; 
      grp[x.nama].rec.push(x); 
      // CUMA DIJUMLAHIN KALAU STATUSNYA DISETUJUI
      if(x.status === 'DISETUJUI') {
        grp[x.nama].totalJam += dVal; 
      }
    });
    
    let h = '<div class="grid-2">'; let idx=0;
    for(const n in grp) {
      h += `
      <div class="acc-item">
        <div class="acc-header" onclick="toggleAcc('dbAcc-${idx}')">
          <span>${n} <span style="font-size:10px;color:var(--text-muted);">#${grp[n].id}</span></span>
          <span class="acc-badge" style="background:#fff0f2; color:var(--primary-red); padding:4px 8px; border-radius:6px;">${formatTeksJam(grp[n].totalJam)}</span>
        </div>
        <div id="dbAcc-${idx}" class="acc-body">`;
      grp[n].rec.forEach(r => { 
        const isDitolak = r.status === 'DITOLAK';
        const statusBadge = isDitolak ? '<span style="font-size:9px; background:#fee2e2; color:#b91c1c; padding:2px 6px; border-radius:4px; margin-left:5px;">DITOLAK</span>' : '';
        const durasiStyle = isDitolak ? 'text-decoration:line-through; color:#94a3b8;' : 'color:var(--text-main);';

        h += `<div class="acc-row"><span>📅 ${r.tanggal_lembur} <strong style="color:var(--primary-red); font-size:10px;">(${r.jam_awal} - ${r.jam_selesai})</strong></span> ${statusBadge} <strong style="${durasiStyle}">${formatTeksJam(r.durasi)}</strong></div>`; 
      });
      h += `</div></div>`; idx++;
    } box.innerHTML = h + '</div>';
  }

  function exportData(t) {
    let raw = []; let fn = "";
    if(t === 'izin') {
      const b = document.getElementById('filterBulanDbIzin').value; const s = document.getElementById('searchDbIzin').value.toLowerCase();
      raw = state.izin.filter(x => x.status !== 'PENDING' && (x.nama.toLowerCase().includes(s) || x.id_karyawan.toLowerCase().includes(s)) && (b === 'ALL' || getMonthStringFromDate(x.tanggal_izin_mulai) === b))
      .map(i => ({"ID Karyawan": i.id_karyawan, "Nama Karyawan": i.nama, "Tgl Mulai": i.tanggal_izin_mulai, "Tgl Akhir": i.tanggal_izin_akhir, "Kategori": i.kategori_izin, "Alasan": i.alasan, "Status": i.status}));
      fn = `Laporan_Izin_${b.replace(/\s/g, '_')}.csv`;
    } else {
      const b = document.getElementById('filterBulanDbLembur').value; const s = document.getElementById('searchDbLembur').value.toLowerCase();
      // EXPORT JUGA MEMBAWA DATA YANG DITOLAK
      raw = state.lembur.filter(x => x.status !== 'PENDING' && (x.nama.toLowerCase().includes(s) || x.id_karyawan.toLowerCase().includes(s)) && (b === 'ALL' || x.bulan_lembur === b))
      .map(l => ({"ID Karyawan": l.id_karyawan, "Nama Karyawan": l.nama, "Tanggal Lembur": l.tanggal_lembur, "Jam Awal": l.jam_awal, "Jam Selesai": l.jam_selesai, "Durasi (Jam)": parseFloat(l.durasi), "Alasan": l.alasan, "Bulan Rekap": l.bulan_lembur, "Status": l.status}));
      fn = `Laporan_Lembur_${b.replace(/\s/g, '_')}.csv`;
    }
    if(!raw.length) return showCustomAlert("❌ Data kosong, tidak ada laporan yang bisa dicetak berdasarkan filter ini.");
    
    const csv = Papa.unparse(raw, {delimiter:";", quotes:true}); const blob = new Blob(["\ufeff" + csv], {type:'text/csv;charset=utf-8;'});
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = fn; link.click();
  }

  // --- KARYAWAN MASTER DATA ---
  function renderKaryawan() {
    const box = document.getElementById('boxListKaryawan'); 
    let h = '<div class="grid-2">';
    state.master.forEach(m => {
      const safenm = m.nama_karyawan.replace(/'/g, "\\'");
      h += `
      <div class="req-card" style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>${m.nama_karyawan}</strong><br><span style="font-size:11px; color:var(--text-muted);">ID: #${m.id_karyawan}</span></div>
        <div style="display:flex; gap:8px;"><button onclick="openKarModal('UPDATE', '${m.id_karyawan}', '${safenm}')" style="background:#ebf8ff; color:#3182ce; border:none; padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer;">Edit</button><button onclick="deleteKaryawan('${m.id_karyawan}')" style="background:#fee2e2; color:#991b1b; border:none; padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer;">Hapus</button></div>
      </div>`;
    }); box.innerHTML = h + '</div>';
  }

  function openKarModal(mode, id = '', nama = '') { document.getElementById('karTitle').innerText = mode === 'ADD' ? 'Tambah Karyawan' : 'Edit Karyawan'; document.getElementById('kId').value = id; document.getElementById('kNm').value = nama; document.getElementById('kId').disabled = mode === 'UPDATE'; document.getElementById('karModal').style.display = 'flex'; setTimeout(() => document.getElementById('karModal').style.opacity = '1', 10); }
  async function saveKar() { const id = document.getElementById('kId').value; const nm = document.getElementById('kNm').value; if(!id || !nm) return showCustomAlert("ID dan Nama wajib diisi!"); await db.from('master_data').upsert({ id_karyawan: id, nama_karyawan: nm }); closeModal('karModal'); showCustomAlert("Data Karyawan tersimpan!"); fetchAllData(); }
  function deleteKaryawan(id) { showCustomConfirm(`Yakin ingin menghapus permanen karyawan ID #${id}?`, async () => { await db.from('master_data').delete().eq('id_karyawan', id); showCustomAlert("Karyawan berhasil dihapus!"); fetchAllData(); }); }
</script>
</body>
</html>
